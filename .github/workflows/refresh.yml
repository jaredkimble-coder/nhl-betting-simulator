{"name": "Refresh NHL betting simulator", "on": {"schedule": [{"cron": "25 * * * *"}], "workflow_dispatch": {"inputs": {"force": {"description": "Rebuild even if nothing changed (true or false)", "required": false, "default": "false"}}}}, "permissions": {"contents": "write", "pages": "write", "id-token": "write"}, "concurrency": {"group": "refresh-sim", "cancel-in-progress": false}, "jobs": {"build": {"runs-on": "ubuntu-latest", "timeout-minutes": 120, "environment": {"name": "github-pages", "url": "${{ steps.deploy.outputs.page_url }}"}, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12", "cache": "pip"}}, {"name": "Install", "run": "pip install -r requirements.txt"}, {"name": "Build the page", "id": "build", "env": {"N8N_INPUTS_URL": "https://gdcgroup.app.n8n.cloud/webhook/nhl-sim-inputs", "N8N_INPUTS_TOKEN": "${{ secrets.N8N_INPUTS_TOKEN }}", "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}", "FORCE": "${{ github.event.inputs.force }}"}, "run": "python refresh.py"}, {"if": "steps.build.outputs.changed == 'true'", "uses": "actions/upload-pages-artifact@v3", "with": {"path": "site"}}, {"id": "deploy", "if": "steps.build.outputs.changed == 'true'", "uses": "actions/deploy-pages@v4"}]}}}
